<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
<title id="title">Abdelrahman Radwan GitHub profile banner</title>
<desc id="desc">Dark blue and black AI systems portfolio banner for Abdelrahman Radwan.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#050A12"/>
    <stop offset=".55" stop-color="#071525"/>
    <stop offset="1" stop-color="#0A2A52"/>
  </linearGradient>
  <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#F7FAFF"/>
    <stop offset=".58" stop-color="#C7DEFF"/>
    <stop offset="1" stop-color="#4EA1FF"/>
  </linearGradient>
  <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#1F6FFF" stop-opacity="0"/>
    <stop offset=".5" stop-color="#48A8FF" stop-opacity=".9"/>
    <stop offset="1" stop-color="#7CC7FF" stop-opacity="0"/>
  </linearGradient>
  <radialGradient id="glow">
    <stop offset="0" stop-color="#2F8CFF" stop-opacity=".42"/>
    <stop offset="1" stop-color="#2F8CFF" stop-opacity="0"/>
  </radialGradient>
  <filter id="soft"><feGaussianBlur stdDeviation="18"/></filter>
</defs>

<rect width="1200" height="300" rx="24" fill="url(#bg)"/>
<rect x=".75" y=".75" width="1198.5" height="298.5" rx="23.25" fill="none" stroke="#244569" stroke-opacity=".72" stroke-width="1.5"/>

<circle cx="1065" cy="120" r="150" fill="url(#glow)" filter="url(#soft)"/>
<circle cx="1120" cy="115" r="90" fill="none" stroke="#3C8EFF" stroke-opacity=".28"/>
<circle cx="1120" cy="115" r="70" fill="none" stroke="#79BCFF" stroke-opacity=".16"/>
<path d="M760 246 C835 184 900 208 958 151 C1014 97 1064 83 1160 52" fill="none" stroke="url(#line)" stroke-width="3" stroke-linecap="round"/>
<path d="M786 266 C846 226 916 238 978 190 C1048 135 1088 145 1175 108" fill="none" stroke="#2D7DFF" stroke-opacity=".35" stroke-width="1.5"/>

<g opacity=".22" fill="#79BCFF">
  <circle cx="873" cy="68" r="2"/><circle cx="924" cy="92" r="2"/><circle cx="984" cy="54" r="2"/>
  <circle cx="1038" cy="202" r="2"/><circle cx="1106" cy="226" r="2"/><circle cx="1154" cy="176" r="2"/>
</g>
<g stroke="#4E9CFF" stroke-opacity=".15">
  <path d="M824 42 V258"/><path d="M888 42 V258"/><path d="M952 42 V258"/><path d="M1016 42 V258"/>
  <path d="M1080 42 V258"/><path d="M1144 42 V258"/>
</g>

<text x="64" y="70" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" letter-spacing="4" fill="#79BCFF">AI • DATA • SOFTWARE ENGINEERING</text>
<g transform="translate(514 48)" stroke="#9BD1FF" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" fill="none">
  <path d="M10 8 L3 16 L10 24"/>
  <path d="M26 8 L33 16 L26 24"/>
  <path d="M21 5 L15 27"/>
</g>
<line x1="558" y1="65" x2="675" y2="65" stroke="#79BCFF" stroke-opacity=".65" stroke-width="1.5"/>
<text x="64" y="151" font-family="Arial, Helvetica, sans-serif" font-size="60" font-weight="750" fill="url(#name)">Abdelrahman Radwan</text>
<text x="64" y="195" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#A8BBD2">Building measurable AI systems and software.</text>

