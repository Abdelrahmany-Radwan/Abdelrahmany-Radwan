<text x="1080" y="71" font-family="Arial, Helvetica, sans-serif" font-size="12" letter-spacing="2.2" fill="#6EA9E8">BUILD</text>
<text x="1080" y="94" font-family="Arial, Helvetica, sans-serif" font-size="12" letter-spacing="2.2" fill="#6EA9E8">MEASURE</text>
