<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
<title id="title">Abdelrahman Radwan GitHub profile banner</title>
<desc id="desc">Dark blue and black AI systems portfolio banner for Abdelrahman Radwan.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#050A12"/>
    <stop offset=".55" stop-color="#071525"/>
    <stop offset="1" stop-color="#0A2A52"/>
  </linearGradient>
  <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
