    <stop offset=".58" stop-color="#C7DEFF"/>
    <stop offset="1" stop-color="#4EA1FF"/>
  </linearGradient>
  <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#1F6FFF" stop-opacity="0"/>
    <stop offset=".5" stop-color="#48A8FF" stop-opacity=".9"/>
    <stop offset="1" stop-color="#7CC7FF" stop-opacity="0"/>
  </linearGradient>
  <radialGradient id="glow">
    <stop offset="0" stop-color="#2F8CFF" stop-opacity=".42"/>
    <stop offset="1" stop-color="#2F8CFF" stop-opacity="0"/>
  </radialGradient>
  <filter id="soft"><feGaussianBlur stdDeviation="18"/></filter>
</defs>

